<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTMKT Hub — Quản lý Phòng Truyền Thông Marketing</title>
<style>
/* ============================= DESIGN TOKENS ============================= */
:root{
  color-scheme:light;
  --surface-0:#f9f9f7;      /* page plane */
  --surface-1:#fcfcfb;      /* card surface */
  --surface-2:#ffffff;
  --surface-sunken:#f2f1ee;
  --text-primary:#0b0b0b;
  --text-secondary:#52514e;
  --text-muted:#898781;
  --border:rgba(11,11,11,0.10);
  --border-strong:rgba(11,11,11,0.16);
  --grid:#e1e0d9;
  --baseline:#c3c2b7;

  --series-1:#2a78d6; /* blue */
  --series-2:#eb6834; /* orange */
  --series-3:#1baf7a; /* aqua */
  --series-4:#eda100; /* yellow */
  --series-5:#e87ba4; /* magenta */
  --series-6:#008300; /* green */
  --series-7:#4a3aa7; /* violet */
  --series-8:#e34948; /* red */

  --seq-100:#cde2fb; --seq-250:#86b6ef; --seq-450:#2a78d6; --seq-600:#184f95;

  --status-good:#0ca30c;
  --status-warning:#fab219;
  --status-serious:#ec835a;
  --status-critical:#d03b3b;
  --success-text:#006300;

  --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
  --shadow-1:0 1px 2px rgba(11,11,11,0.06), 0 1px 1px rgba(11,11,11,0.04);
  --shadow-2:0 4px 16px rgba(11,11,11,0.08), 0 1px 3px rgba(11,11,11,0.06);
  --sidebar-w:236px;
  --font: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --surface-0:#0d0d0d; --surface-1:#1a1a19; --surface-2:#202020; --surface-sunken:#161615;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8d86;
    --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
    --grid:#2c2c2a; --baseline:#383835;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
    --status-good:#0ca30c; --status-warning:#fab219; --status-serious:#ec835a; --status-critical:#d03b3b;
    --success-text:#0ca30c;
    --shadow-1:0 1px 2px rgba(0,0,0,0.3); --shadow-2:0 4px 20px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --surface-0:#0d0d0d; --surface-1:#1a1a19; --surface-2:#202020; --surface-sunken:#161615;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8d86;
  --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.18);
  --grid:#2c2c2a; --baseline:#383835;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
  --status-good:#0ca30c; --status-warning:#fab219; --status-serious:#ec835a; --status-critical:#d03b3b;
  --success-text:#0ca30c;
  --shadow-1:0 1px 2px rgba(0,0,0,0.3); --shadow-2:0 4px 20px rgba(0,0,0,0.45);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font); background:var(--surface-0); color:var(--text-primary);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;
}
button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:inherit; }
.icon{ width:18px; height:18px; flex:none; display:inline-block; vertical-align:middle; }
.icon-sm{ width:15px; height:15px; }
.icon-lg{ width:26px; height:26px; }
svg.ico{ stroke:currentColor; fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }

/* ============================= LAYOUT ============================= */
#app{ display:flex; min-height:100vh; }
.sidebar{
  width:var(--sidebar-w); flex:none; background:var(--surface-1); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:40;
  transition:transform .2s ease;
}
.brand{ display:flex; align-items:center; gap:10px; padding:18px 18px 14px; }
.brand-mark{ width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--series-1),var(--series-3)); display:flex; align-items:center; justify-content:center; color:#fff; flex:none; }
.brand-text{ line-height:1.15; }
.brand-text b{ display:block; font-size:15px; letter-spacing:.2px; }
.brand-text span{ display:block; font-size:11px; color:var(--text-muted); }

.nav{ flex:1; overflow-y:auto; padding:6px 12px; }
.nav-group-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); padding:14px 10px 6px; }
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius-sm);
  color:var(--text-secondary); text-decoration:none; font-weight:500; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
}
.nav-item .icon{ color:var(--text-muted); }
.nav-item:hover{ background:var(--surface-sunken); color:var(--text-primary); }
.nav-item.active{ background:var(--series-1); color:#fff; }
.nav-item.active .icon{ color:#fff; }
.nav-item .badge{ margin-left:auto; background:var(--status-critical); color:#fff; font-size:11px; font-weight:700; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 5px; }

.sidebar-foot{ padding:12px; border-top:1px solid var(--border); }
.user-chip{ display:flex; align-items:center; gap:9px; padding:8px; border-radius:var(--radius-sm); }
.user-chip:hover{ background:var(--surface-sunken); }
.avatar{ width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:#fff; flex:none; }
.user-chip-text{ line-height:1.2; overflow:hidden; }
.user-chip-text b{ display:block; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:130px; }
.user-chip-text span{ display:block; font-size:11px; color:var(--text-muted); }

.main{ flex:1; margin-left:var(--sidebar-w); min-width:0; display:flex; flex-direction:column; }
.topbar{
  height:60px; flex:none; display:flex; align-items:center; gap:12px; padding:0 22px;
  border-bottom:1px solid var(--border); position:sticky; top:0; background:color-mix(in srgb, var(--surface-0) 88%, transparent);
  backdrop-filter:blur(8px); z-index:30;
}
.menu-btn{ display:none; background:none; border:none; padding:6px; border-radius:8px; }
.menu-btn:hover{ background:var(--surface-sunken); }
.page-title{ font-size:17px; font-weight:700; }
.page-sub{ font-size:12px; color:var(--text-muted); font-weight:500; }
.topbar-spacer{ flex:1; }
.icon-btn{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface-1);
  display:flex; align-items:center; justify-content:center; color:var(--text-secondary); position:relative;
}
.icon-btn:hover{ background:var(--surface-sunken); color:var(--text-primary); }
.dot-badge{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:var(--status-critical); border:2px solid var(--surface-0); }

.view{ padding:22px; max-width:1360px; width:100%; margin:0 auto; }
.view-header{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.view-header h2{ margin:0 0 3px; font-size:20px; }
.view-header p{ margin:0; color:var(--text-muted); font-size:13px; }

/* ============================= COMPONENTS ============================= */
.card{ background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-1); }
.card-pad{ padding:18px 18px; }
.grid{ display:grid; gap:16px; }
.grid-4{ grid-template-columns:repeat(4,1fr); }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-2{ grid-template-columns:2fr 1fr; }
@media (max-width:1080px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;} }

.stat-tile{ padding:18px; display:flex; flex-direction:column; gap:10px; }
.stat-tile .tile-top{ display:flex; align-items:center; justify-content:space-between; }
.stat-tile .label{ font-size:12.5px; color:var(--text-secondary); font-weight:600; }
.stat-tile .tile-icon{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; }
.stat-tile .value{ font-size:28px; font-weight:700; letter-spacing:-.01em; }
.stat-tile .delta{ font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px; }
.delta.up{ color:var(--success-text); } .delta.down{ color:var(--status-critical); } .delta.flat{ color:var(--text-muted); }
.sparkline{ display:block; margin-top:2px; }

.btn{ display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:10px; border:1px solid var(--border-strong); background:var(--surface-1); font-weight:600; font-size:13px; }
.btn:hover{ background:var(--surface-sunken); }
.btn-primary{ background:var(--series-1); border-color:var(--series-1); color:#fff; }
.btn-primary:hover{ background:var(--seq-600); }
.btn-sm{ padding:6px 10px; font-size:12.5px; border-radius:8px; }
.btn-ghost{ border-color:transparent; background:transparent; }
.btn-ghost:hover{ background:var(--surface-sunken); }
.btn-danger-ghost{ border-color:transparent; background:transparent; color:var(--status-critical); }
.btn-danger-ghost:hover{ background:color-mix(in srgb, var(--status-critical) 12%, transparent); }

.field{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.field label{ font-size:12.5px; font-weight:600; color:var(--text-secondary); }
.field input, .field select, .field textarea{
  padding:8px 10px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--text-primary); width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--series-1); outline-offset:1px; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

.search-box{ display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong); background:var(--surface-1); border-radius:10px; padding:7px 12px; min-width:220px; }
.search-box input{ border:none; background:none; outline:none; width:100%; }
.search-box .icon{ color:var(--text-muted); }

.chip{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
.chip-good{ background:color-mix(in srgb, var(--status-good) 16%, transparent); color:var(--status-good); }
.chip-warn{ background:color-mix(in srgb, var(--status-warning) 22%, transparent); color:#8a5a00; }
.chip-serious{ background:color-mix(in srgb, var(--status-serious) 20%, transparent); color:#9a4322; }
.chip-critical{ background:color-mix(in srgb, var(--status-critical) 16%, transparent); color:var(--status-critical); }
.chip-neutral{ background:var(--surface-sunken); color:var(--text-secondary); }
:root[data-theme="dark"] .chip-warn{ color:var(--status-warning); }
:root[data-theme="dark"] .chip-serious{ color:var(--status-serious); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip-warn{ color:var(--status-warning);} :root:not([data-theme="light"]) .chip-serious{ color:var(--status-serious);} }

table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:700; padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
td{ padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; }
tbody tr:hover{ background:var(--surface-sunken); }
.table-wrap{ overflow-x:auto; }
.cell-name{ display:flex; align-items:center; gap:9px; }
.muted{ color:var(--text-muted); }
.tabular{ font-variant-numeric:tabular-nums; }
.text-right{ text-align:right; }

.toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.select-pill{ padding:7px 10px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface-1); font-weight:600; font-size:12.5px; }
.spacer{ flex:1; }

.legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; }
.legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); font-weight:600; }
.legend-dot{ width:9px; height:9px; border-radius:2px; flex:none; }

.modal-backdrop{ position:fixed; inset:0; background:rgba(11,11,11,0.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
.modal{ background:var(--surface-1); border-radius:var(--radius-lg); box-shadow:var(--shadow-2); width:100%; max-width:520px; max-height:90vh; overflow-y:auto; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); }
.modal-head h3{ margin:0; font-size:16px; }
.modal-body{ padding:18px; }
.modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:14px 18px; border-top:1px solid var(--border); }

.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--text-primary); color:var(--surface-0); padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:var(--shadow-2); display:flex; align-items:center; gap:8px; animation:toastin .18s ease; }
@keyframes toastin{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

.kanban{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; align-items:start; }
@media (max-width:1000px){ .kanban{ grid-template-columns:1fr 1fr; } }
.kanban-col{ background:var(--surface-sunken); border-radius:var(--radius-md); padding:10px; min-height:120px; max-height:calc(100vh - 260px); overflow-y:auto; }
.kanban-col-head{ display:flex; align-items:center; justify-content:space-between; padding:4px 6px 10px; font-weight:700; font-size:12.5px; }
.kanban-count{ background:var(--surface-2); border-radius:999px; padding:1px 8px; font-size:11px; color:var(--text-secondary); }
.task-card{ background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px; margin-bottom:9px; box-shadow:var(--shadow-1); }
.task-card .t-title{ font-weight:600; font-size:13px; margin-bottom:6px; }
.task-card .t-meta{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--text-muted); }
.priority-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }

.empty-state{ text-align:center; padding:50px 20px; color:var(--text-muted); }

.login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--surface-0); padding:20px; }
.login-card{ width:100%; max-width:380px; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-2); padding:32px 28px; text-align:center; }
.login-card .brand-mark{ margin:0 auto 14px; width:52px; height:52px; border-radius:14px; }
.login-card h1{ font-size:18px; margin:0 0 4px; }
.login-card p{ color:var(--text-muted); font-size:13px; margin:0 0 22px; }
#gsi-btn-holder{ display:flex; justify-content:center; margin-bottom:12px; min-height:40px; }
.divider{ display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:11.5px; margin:16px 0; }
.divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--border); }

.meter{ height:8px; border-radius:5px; background:var(--surface-sunken); overflow:hidden; }
.meter > span{ display:block; height:100%; border-radius:5px; }

.progress-ring-row{ display:flex; align-items:center; gap:12px; }

@media (max-width:880px){
  .sidebar{ transform:translateX(-100%); box-shadow:var(--shadow-2); }
  .sidebar.open{ transform:translateX(0); }
  .main{ margin-left:0; }
  .menu-btn{ display:flex; }
  .grid-4, .grid-3{ grid-template-columns:1fr 1fr; }
}
.overlay-scrim{ position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:35; display:none; }
.overlay-scrim.show{ display:block; }
</style>
</head>
<body>

<div id="login-screen" class="login-screen" style="display:none;"></div>

<div id="app" style="display:none;">
  <div class="overlay-scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view-root"></main>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast-wrap" id="toast-wrap"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* =====================================================================
   TTMKT HUB — Hệ thống quản lý Phòng Truyền Thông Marketing
   File tĩnh, một trang duy nhất (không build step) để tải nhanh nhất có thể.
   Mặc định chạy ở CHẾ ĐỘ DEMO với dữ liệu mẫu — không cần đăng nhập thật.
   Để nối vào dữ liệu thật, xem khối CONFIG bên dưới + SOP triển khai đi kèm.
   ===================================================================== */

/* ============================= CONFIG ============================= */
const CONFIG = {
  // Điền 3 giá trị dưới đây theo hướng dẫn trong SOP để chạy với dữ liệu thật.
  // Để trống -> ứng dụng tự chạy ở chế độ DEMO (dữ liệu mẫu, không cần Google).
  GOOGLE_CLIENT_ID: "94055741992-5im0dc2qp4rc147k7audqme8fs62dakj.apps.googleusercontent.com",   // OAuth Client ID từ Google Cloud Console
  API_URL: "https://script.google.com/macros/s/AKfycbxp9jG8r0RC7FMY1A7DVs_q0maidNPgcjSyzRugmiD8b4wc2wQleNpOGTsER3I6Vl-m/exec",            // URL /exec của Apps Script Web App (Api.gs)

const DEMO_MODE = !CONFIG.GOOGLE_CLIENT_ID || !CONFIG.API_URL;

/* ============================= SAMPLE / DEMO DATA ============================= */

   sẽ gọi Apps Script thay vì đọc từ đây. Cấu trúc trường dữ liệu bên dưới khớp
   1-1 với các sheet mô tả trong backend/Setup.gs để việc chuyển đổi không cần
   đổi tên trường ở tầng giao diện. */

const POSITIONS = ["Content","Design","Ads","Social","SEO","Video/Editor","KOL-Seeding"];

const KPI_DEFS = {
  "Content": [
    {ten:"Số bài viết/tháng", donVi:"bài", chiTieu:20, trongSo:0.4, nghich:false},
    {ten:"Tỷ lệ tương tác TB", donVi:"%", chiTieu:4.5, trongSo:0.3, nghich:false},

  ],
  "Design": [
    {ten:"Số ấn phẩm/tháng", donVi:"ấn phẩm", chiTieu:30, trongSo:0.4, nghich:false},
    {ten:"Đúng hạn", donVi:"%", chiTieu:95, trongSo:0.3, nghich:false},
    {ten:"Số lần sửa lại TB", donVi:"lần", chiTieu:1.5, trongSo:0.3, nghich:true},
  ],
  "Ads": [
    {ten:"Doanh thu từ QC", donVi:"triệu đ", chiTieu:500, trongSo:0.4, nghich:false},
    {ten:"ROAS", donVi:"x", chiTieu:4.0, trongSo:0.3, nghich:false},
    {ten:"CPL", donVi:"nghìn đ", chiTieu:150, trongSo:0.3, nghich:true},
  ],
  "Social": [
    {ten:"Followers mới/tháng", donVi:"người", chiTieu:3000, trongSo:0.3, nghich:false},
    {ten:"Tỷ lệ tương tác", donVi:"%", chiTieu:5, trongSo:0.4, nghich:false},
    {ten:"Đăng đúng lịch", donVi:"%", chiTieu:95, trongSo:0.3, nghich:false},
  ],
  "SEO": [
    {ten:"Từ khoá Top 10", donVi:"từ khoá", chiTieu:15, trongSo:0.4, nghich:false},
    {ten:"Traffic tự nhiên", donVi:"lượt", chiTieu:20000, trongSo:0.3, nghich:false},
    {ten:"Backlink chất lượng", donVi:"link", chiTieu:25, trongSo:0.3, nghich:false},
  ],
  "Video/Editor": [
    {ten:"Video hoàn thành", donVi:"video", chiTieu:12, trongSo:0.4, nghich:false},
    {ten:"Lượt xem TB", donVi:"lượt", chiTieu:5000, trongSo:0.3, nghich:false},
    {ten:"Đúng hạn", donVi:"%", chiTieu:95, trongSo:0.3, nghich:false},

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

        const trend = mi*0.02;

        factor = Math.max(0.55, Math.min(1.32, factor));

          thucTe = def.chiTieu * (2 - factor); // factor cao hơn -> thực tế thấp hơn (tốt hơn) cho chỉ số nghịch
          thucTe = Math.max(def.chiTieu*0.5, thucTe);
        } else {
          thucTe = def.chiTieu * factor * (isCurrent? monthFrac*1.55 : 1);
        }
        thucTe = Math.round(thucTe*10)/10;

/* ============================= CHART HELPERS (hand-rolled inline SVG, no chart library) ============================= */
/* Theo dataviz spec: line 2px, marker r>=4 với viền surface 2px, bar <=24px dày, đầu bo 4px vuông ở baseline,
   gridline hairline 1px màu recessive, legend luôn có khi >=2 chuỗi, nhãn số đặt chọn lọc (không nhồi mọi điểm),
   màu category theo thứ tự cố định, màu trạng thái (status) chỉ dùng cho state. */

const CVAR = getComputedStyle(document.documentElement);
function cssVar(name){ return getComputedStyle(document.body).getPropertyValue(name).trim() || '#888'; }

function svgWrap(w,h,inner,cls){
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" class="${cls||''}" preserveAspectRatio="none" role="img">${inner}</svg>`;
}

/* ---- Sparkline: dùng cho stat tile & xu hướng nhỏ ---- */
function sparklineSVG(values, {w=120,h=32,color,fillOpacity=0.12}={}){
  color = color || cssVar('--series-1');
  if(!values.length) return svgWrap(w,h,'');
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max-min)||1;
  const stepX = w/(values.length-1||1);
  const pts = values.map((v,i)=>[i*stepX, h-4 - ((v-min)/range)*(h-8)]);
  const line = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${w},${h} L0,${h} Z`;
  const last = pts[pts.length-1];
  return svgWrap(w,h, `
    <path d="${area}" fill="${color}" opacity="${fillOpacity}" stroke="none"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${color}" stroke="${cssVar('--surface-1')}" stroke-width="1.6"/>
  `, 'sparkline');
}

/* ---- Line chart nhiều điểm với trục & lưới, dùng cho "xu hướng theo tháng" ---- */
function trendLineSVG(labels, series, {w=680,h=220,padL=34,padB=26,padT=14,padR=14}={}){
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const allVals = series.flatMap(s=>s.values);
  let max = Math.max(...allVals,0), min = Math.min(...allVals,0);
  if(max===min){ max += 1; }
  const niceMax = max*1.12;
  const x = i => padL + (labels.length<=1?0:i*(plotW/(labels.length-1)));
  const y = v => padT + plotH - ((v-min)/(niceMax-min))*plotH;
  const gridLines = [0,0.25,0.5,0.75,1].map(t=>{
    const yy = padT + plotH*(1-t);
    const val = Math.round((min + (niceMax-min)*t));
    return `<line x1="${padL}" x2="${w-padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="${cssVar('--grid')}" stroke-width="1"/>
            <text x="${padL-8}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="10.5" fill="${cssVar('--text-muted')}">${val.toLocaleString('vi-VN')}</text>`;
  }).join('');
  const xLabels = labels.map((l,i)=>`<text x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="10.5" fill="${cssVar('--text-muted')}">${l}</text>`).join('');
  const paths = series.map((s)=>{
    const pts = s.values.map((v,i)=>[x(i), y(v)]);
    const line = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const lastP = pts[pts.length-1];
    const dots = pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="${s.color}" stroke="${cssVar('--surface-1')}" stroke-width="1.8"><title>${s.name}: ${labels[i]} — ${s.values[i].toLocaleString('vi-VN')}${s.unit||''}</title></circle>`).join('');
    const label = `<text x="${(lastP[0]+7).toFixed(1)}" y="${(lastP[1]+3.5).toFixed(1)}" font-size="11" font-weight="700" fill="${cssVar('--text-primary')}">${s.values[s.values.length-1].toLocaleString('vi-VN')}${s.unit||''}</text>`;
    return `<path d="${line}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${label}`;
  }).join('');
  return svgWrap(w,h, gridLines + xLabels + paths);
}

/* ---- Bullet-style bar: Thực tế (bar màu) so với Mục tiêu (vạch mốc) — dùng cho so sánh KPI ---- */
function bulletBarsSVG(rows, {w=560,barH=18,gap=14,padL=150,padR=54}={}){
  // rows: [{label, actual, target, color, unit, over}]
  const plotW = w-padL-padR;
  const maxVal = Math.max(...rows.map(r=>Math.max(r.actual,r.target)))*1.15 || 1;
  const rowH = barH+gap;
  const h = rows.length*rowH + 8;
  const bars = rows.map((r,i)=>{
    const yy = 6 + i*rowH;
    const barW = Math.max(2,(r.actual/maxVal)*plotW);
    const targetX = padL + (r.target/maxVal)*plotW;
    const good = r.over ? r.actual>=r.target : r.actual<=r.target;
    const color = r.color || (good? cssVar('--status-good') : cssVar('--series-1'));
    // đặt nhãn số sau vị trí xa nhất giữa (đầu cột, vạch mốc) để không bao giờ chồng lên vạch mốc
    const labelX = Math.max(padL+barW, targetX) + 8;
    return `
      <text x="${padL-10}" y="${(yy+barH*0.72).toFixed(1)}" text-anchor="end" font-size="12" fill="${cssVar('--text-secondary')}" font-weight="600">${r.label}</text>
      <rect x="${padL}" y="${yy}" width="${plotW}" height="${barH}" rx="4" fill="${cssVar('--surface-sunken')}"/>
      <rect x="${padL}" y="${yy}" width="${barW.toFixed(1)}" height="${barH}" rx="4" fill="${color}">
        <title>${r.label}: thực tế ${r.actual.toLocaleString('vi-VN')}${r.unit||''} / mục tiêu ${r.target.toLocaleString('vi-VN')}${r.unit||''}</title>
      </rect>
      <line x1="${targetX.toFixed(1)}" x2="${targetX.toFixed(1)}" y1="${yy-3}" y2="${yy+barH+3}" stroke="${cssVar('--text-primary')}" stroke-width="2"/>
      <text x="${labelX.toFixed(1)}" y="${(yy+barH*0.72).toFixed(1)}" font-size="11.5" font-weight="700" fill="${cssVar('--text-primary')}">${r.actual.toLocaleString('vi-VN')}${r.unit||''}</text>
    `;
  }).join('');
  return svgWrap(w,h,bars);
}

/* ---- Cột trạng thái công việc (categorical theo state, dùng bảng màu status) ---- */
function statusBarSVG(counts, {w=520,h=190}={}){
  // counts: [{label,value,color}]
  const padL=10,padR=10,padT=14,padB=26;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const max = Math.max(...counts.map(c=>c.value),1)*1.2;
  const slot = plotW/counts.length;
  const barW = Math.min(46, slot*0.5);
  const bars = counts.map((c,i)=>{
    const bh = (c.value/max)*plotH;
    const cx = padL + slot*i + slot/2;
    const x0 = cx-barW/2, y0 = padT+plotH-bh;
    return `
      <rect x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${barW}" height="${Math.max(bh,2).toFixed(1)}" rx="4" fill="${c.color}">
        <title>${c.label}: ${c.value}</title>
      </rect>
      <text x="${cx.toFixed(1)}" y="${(y0-6).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="${cssVar('--text-primary')}">${c.value}</text>
      <text x="${cx.toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="${cssVar('--text-muted')}">${c.label}</text>
    `;
  }).join('');
  const baseline = `<line x1="${padL}" x2="${w-padR}" y1="${padT+plotH}" y2="${padT+plotH}" stroke="${cssVar('--baseline')}" stroke-width="1"/>`;
  return svgWrap(w,h, baseline+bars);
}

function legendRow(items){
  return `<div class="legend">${items.map(it=>`<span class="legend-item"><span class="legend-dot" style="background:${it.color}"></span>${it.label}</span>`).join('')}</div>`;
}

function meterBar(pct, color){
  const p = Math.max(0,Math.min(100,pct));
  return `<div class="meter"><span style="width:${p}%;background:${color}"></span></div>`;
}

function hueForName(name){ let h=0; for(const c of name) h = (h*31 + c.charCodeAt(0))>>>0; const hues=[cssVar('--series-1'),cssVar('--series-2'),cssVar('--series-3'),cssVar('--series-4'),cssVar('--series-5'),cssVar('--series-6'),cssVar('--series-7'),cssVar('--series-8')]; return hues[h%hues.length]; }

async function realCall(action, payload){
  const body = JSON.stringify({action, token: currentUser?.idToken, payload});
  const res = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body});
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json.data;
}

/* ============================= EVALUATION ENGINE ============================= */
function kpiScoreForStaff(maNV, thang){
  const staff = DB.nhanSu.find(s=>s.maNV===maNV);
  const defs = DB.kpiViTri[staff.viTri] || [];
  if(!defs.length) return {score:null, rows:[]};
  let total=0, rows=[];
  defs.forEach(def=>{
    const row = DB.kpiThang.find(k=>k.maNV===maNV && k.thang===thang && k.tenChiSo===def.ten);
    const thucTe = row? row.thucTe : 0;
    let tyLe = def.nghich ? (thucTe>0? def.chiTieu/thucTe*100 : 100) : (thucTe/def.chiTieu*100);
    tyLe = Math.max(0, Math.min(130, tyLe));
    total += tyLe*def.trongSo;
    rows.push({...def, thucTe, tyLe});
  });
  return {score: Math.round(total*10)/10, rows};
}
function taskScoreForStaff(maNV, thang){
  const tasks = DB.congViec.filter(c=>c.maNV===maNV && (monthOf(c.ngayGiao)===thang));
  if(!tasks.length) return {score:null, total:0, done:0, late:0, onTimeRate:0, avgQuality:0};
  const done = tasks.filter(t=>t.trangThai==="HoanThanh");
  const late = tasks.filter(t=>t.trangThai==="TreHan").length;
  const onTimeDone = done.filter(t=> t.ngayHoanThanh <= t.hanChot).length;
  const completionRate = done.length/tasks.length;
  const onTimeRate = done.length? onTimeDone/done.length : 0;
  const avgQuality = done.length? done.reduce((a,t)=>a+(t.diemChatLuong||0),0)/done.length : 0;
  const score = Math.round((completionRate*0.5 + onTimeRate*0.3 + (avgQuality/5)*0.2)*100*10)/10;
  return {score, total:tasks.length, done:done.length, late, onTimeRate:Math.round(onTimeRate*100), avgQuality:Math.round(avgQuality*10)/10};
}
function evaluateStaff(maNV, thang){
  const cfg = DB.cauHinh;
  const kpi = kpiScoreForStaff(maNV, thang);
  const task = taskScoreForStaff(maNV, thang);
  const kpiScore = kpi.score ?? 0;
  const taskScore = task.score ?? 0;
  const tong = Math.round((kpiScore*cfg.trongSoKPI + taskScore*cfg.trongSoCongViec)*10)/10;
  let xepLoai, chip;
  if(tong>=cfg.nguongXuatSac){ xepLoai="Xuất sắc"; chip="chip-good"; }
  else if(tong>=cfg.nguongDat){ xepLoai="Đạt"; chip="chip-neutral"; }
  else if(tong>=cfg.nguongKhongDat){ xepLoai="Cần cải thiện"; chip="chip-warn"; }
  else { xepLoai="Không đạt"; chip="chip-critical"; }
  let thuongPhat = 0;
  if(tong>=cfg.nguongXuatSac) thuongPhat = (tong-cfg.nguongDat)*cfg.donGiaThuong;
  else if(tong<cfg.nguongKhongDat) thuongPhat = -(cfg.nguongKhongDat-tong)*cfg.donGiaPhat;
  return {maNV, thang, kpiScore, taskScore, tong, xepLoai, chip, thuongPhat, kpiRows:kpi.rows, taskDetail:task};
}

      if(btn) btn.disabled = false;
    }
  }));
}
function closeModal(){ byId('modal-root').innerHTML=''; }

/* ============================= VIEW: DASHBOARD ============================= */
function renderDashboard(){
  const staff = visibleStaff();
  const staffNVs = staff.map(s=>s.maNV);
  const m = currentMonthKey();
  const prevM = DB.months[DB.months.length-2]?.key;

  const tasksThisMonth = DB.congViec.filter(c=>staffNVs.includes(c.maNV) && monthOf(c.ngayGiao)===m);
  const doneOnTime = tasksThisMonth.filter(t=>t.trangThai==='HoanThanh' && t.ngayHoanThanh<=t.hanChot).length;
  const doneRate = tasksThisMonth.length? Math.round(doneOnTime/tasksThisMonth.length*100):0;

  const evals = staffNVs.map(nv=>evaluateStaff(nv,m));
  const avgScore = evals.length? Math.round(evals.reduce((a,e)=>a+e.tong,0)/evals.length*10)/10 : 0;
  const avgKpi = evals.length? Math.round(evals.reduce((a,e)=>a+e.kpiScore,0)/evals.length*10)/10 : 0;

  const lateCount = DB.congViec.filter(c=>staffNVs.includes(c.maNV) && c.trangThai==='TreHan').length;

  function trendFor(fn){ return DB.months.map(mo=>{ const vs = staffNVs.map(nv=>fn(nv,mo.key)).filter(v=>v!=null); return vs.length? vs.reduce((a,b)=>a+b,0)/vs.length : 0; }); }
  const kpiTrend = trendFor((nv,mo)=>kpiScoreForStaff(nv,mo).score);
  const scoreTrend = trendFor((nv,mo)=>evaluateStaff(nv,mo).tong);
  const doneRateTrend = DB.months.map(mo=>{ const ts=DB.congViec.filter(c=>staffNVs.includes(c.maNV)&&monthOf(c.ngayGiao)===mo.key); const d=ts.filter(t=>t.trangThai==='HoanThanh'&&t.ngayHoanThanh<=t.hanChot).length; return ts.length? Math.round(d/ts.length*100):0; });
  const staffCountTrend = DB.months.map(()=>staff.length);

  function delta(trend){ const a=trend[trend.length-2], b=trend[trend.length-1]; if(a==null||a===0) return {dir:'flat',txt:'—'}; const d=Math.round((b-a)*10)/10; return {dir:d>0.05?'up':d<-0.05?'down':'flat', txt:(d>0?'+':'')+d}; }

  const tiles = [
    {label:"Nhân sự đang quản lý", value: staff.length, icon:"users", color:"var(--series-1)", trend:staffCountTrend, unit:"", deltaTxt:null},
    {label:"Việc hoàn thành đúng hạn", value: doneRate+"%", icon:"clipboard", color:"var(--status-good)", trend:doneRateTrend, deltaOverride:delta(doneRateTrend)},
    {label:"KPI trung bình phòng", value: avgKpi+"%", icon:"target", color:"var(--series-3)", trend:kpiTrend, deltaOverride:delta(kpiTrend)},
    {label:"Điểm đánh giá trung bình", value: avgScore, icon:"award", color:"var(--series-7)", trend:scoreTrend, deltaOverride:delta(scoreTrend)},
  ];

  const bulletRows = POSITIONS.filter(p=> canSeeAllDept() || p===currentUser.viTri).map(p=>{
    const nvs = DB.nhanSu.filter(s=>s.viTri===p).map(s=>s.maNV).filter(nv=>staffNVs.includes(nv));
    if(!nvs.length) return null;
    const avg = nvs.reduce((a,nv)=>a+(kpiScoreForStaff(nv,m).score||0),0)/nvs.length;
    return {label:p, actual: Math.round(avg*10)/10, target:100, unit:"%", over:true};
  }).filter(Boolean);

  const statusCounts = ["ChuaBatDau","DangLam","HoanThanh","TreHan"].map(k=>({label:STATUS_META[k].label, value: tasksThisMonth.filter(t=>t.trangThai===k).length, color:STATUS_META[k].color.replace('var(','').replace(')','') }));
  // resolve css vars to actual colors for SVG fill
  statusCounts.forEach(c=> c.color = cssVar(c.color.trim()) || c.color);

  const attention = staffNVs.map(nv=>{
    const s = DB.nhanSu.find(x=>x.maNV===nv);
    const late = DB.congViec.filter(c=>c.maNV===nv && c.trangThai==='TreHan').length;
    const ev = evaluateStaff(nv,m);
    return {s, late, tong: ev.tong};
  }).filter(x=>x.late>0 || x.tong < DB.cauHinh.nguongDat).sort((a,b)=> (b.late-a.late) || (a.tong-b.tong)).slice(0,5);

  byId('view-root').innerHTML = `
    <div class="grid grid-4" style="margin-bottom:16px;">
      ${tiles.map(t=>{
        const d = t.deltaOverride || {dir:'flat', txt:''};
        return `<div class="card stat-tile">
          <div class="tile-top">
            <span class="label">${t.label}</span>
            <span class="tile-icon" style="background:color-mix(in srgb, ${t.color} 16%, transparent); color:${t.color}">${icon(t.icon,'icon-sm')}</span>
          </div>
          <div class="value">${t.value}</div>
          ${sparklineSVG(t.trend, {color:t.color})}
          ${d.txt? `<div class="delta ${d.dir}">${icon(d.dir==='up'?'arrowUpRight':d.dir==='down'?'arrowDownRight':'minus','icon-sm')} ${d.txt} so với tháng trước</div>`:''}
        </div>`;
      }).join('')}
    </div>
    <div class="grid grid-2" style="margin-bottom:16px;">
      <div class="card card-pad">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <b style="font-size:14px;">Xu hướng điểm đánh giá & KPI trung bình</b>
        </div>
        ${trendLineSVG(DB.months.map(m2=>m2.label.replace('Tháng ','T').replace('/2026','')), [
          {name:"Điểm đánh giá", values:scoreTrend.map(v=>Math.round(v*10)/10), color:cssVar('--series-7')},
          {name:"KPI trung bình", values:kpiTrend.map(v=>Math.round(v*10)/10), color:cssVar('--series-1'), unit:"%"},
        ])}
        ${legendRow([{label:"Điểm đánh giá", color:cssVar('--series-7')},{label:"KPI trung bình (%)", color:cssVar('--series-1')}])}
      </div>
      <div class="card card-pad">
        <b style="font-size:14px;">Công việc theo trạng thái — ${DB.months.find(x=>x.key===m).label}</b>
        ${statusBarSVG(statusCounts)}
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card card-pad">
        <b style="font-size:14px;">Hiệu suất KPI trung bình theo vị trí</b>
        <div style="margin-top:10px;">${bulletRows.length? bulletBarsSVG(bulletRows): '<div class="empty-state">Chưa có dữ liệu</div>'}</div>
        <div style="font-size:11.5px;color:var(--text-muted);margin-top:6px;">Vạch đen = mốc 100% mục tiêu</div>
      </div>
      <div class="card card-pad">
        <b style="font-size:14px;">Cần chú ý</b>
        <div style="margin-top:8px;">
        ${attention.length? attention.map(a=>`
          <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);">
            ${avatarHtml(a.s.hoTen,30)}
            <div style="flex:1;min-width:0;">
              <div style="font-weight:600;font-size:13px;">${esc(a.s.hoTen)}</div>
              <div style="font-size:11.5px;color:var(--text-muted);">${a.s.viTri}</div>
            </div>
            ${a.late>0?`<span class="chip chip-critical">${a.late} việc trễ</span>`:''}
            <span class="chip ${a.tong<DB.cauHinh.nguongKhongDat?'chip-critical':'chip-warn'}">${a.tong} điểm</span>
          </div>`).join('') : `<div class="empty-state">${icon('check','icon-lg')}<div>Mọi thứ đang ổn định</div></div>`}
        </div>
      </div>
    </div>
  `;
}

        <div style="margin-top:10px;">${staff.length? bulletBarsSVG(bulletRows) : '<div class="empty-state">Không có nhân sự</div>'}</div>

        <b style="font-size:14px;">Định nghĩa chỉ tiêu — ${vt}</b>

        <tbody>
          ${staff.map(s=>{
            const r = kpiScoreForStaff(s.maNV, ui.kpiThang);
            return `<tr>
              <td><div class="cell-name">${avatarHtml(s.hoTen,28)}<b>${esc(s.hoTen)}</b></div></td>

function taskCardHtml(t){

function statusSelectHtml(t){
  const editable = canManage() || t.maNV===currentUser.maNV;
  if(!editable) return `<span class="chip ${t.trangThai==='HoanThanh'?'chip-good':t.trangThai==='TreHan'?'chip-critical':'chip-neutral'}">${STATUS_META[t.trangThai].label}</span>`;

    ${["ChuaBatDau","DangLam","HoanThanh","TreHan"].map(c=>`<option value="${c}" ${c===t.trangThai?'selected':''}>${STATUS_META[c].label}</option>`).join('')}

}
function attachTaskEvents(){
  document.querySelectorAll('[data-task-status]').forEach(sel=>{
    sel.addEventListener('click', e=>e.stopPropagation());

      const maCV = sel.getAttribute('data-task-status');
      const val = sel.value;
      if(val==='HoanThanh'){

        await DataAPI.updateTaskStatus(maCV, val);

    });
  });
}

/* ============================= VIEW: BÁO CÁO ============================= */
function periodRange(){
  if(ui.bcKy==='thang'){ const m = DB.months.find(x=>x.key===ui.bcMonth) || DB.months[DB.months.length-1]; return {start:m.start, end:m.end, label:m.label}; }
  if(ui.bcKy==='quy'){
    const q = ui.bcQuarter || 3; const y = ui.bcYear;
    const startM = (q-1)*3+1; const endM = startM+2;
    return {start:`${y}-${String(startM).padStart(2,'0')}-01`, end:`${y}-${String(endM).padStart(2,'0')}-28`, label:`Quý ${q}/${y}`};
  }
  if(ui.bcKy==='nam'){ return {start:`${ui.bcYear}-01-01`, end:`${ui.bcYear}-12-31`, label:`Năm ${ui.bcYear}`}; }
  // tuần: 7 ngày gần nhất tính đến hôm nay theo demo
  const start = addDays(TODAY,-6);
  return {start: fmtDate(start), end: fmtDate(TODAY), label:`Tuần ${fmtDateVN(fmtDate(start))} – ${fmtDateVN(fmtDate(TODAY))}`};
}
function renderBaoCao(){
  if(!ui.bcMonth) ui.bcMonth = currentMonthKey();
  if(!ui.bcQuarter) ui.bcQuarter = 3;
  const {start,end,label} = periodRange();
  const staffOptions = visibleStaff();
  const rows = staffOptions.map(s=>{
    const tasks = DB.congViec.filter(c=>c.maNV===s.maNV && c.ngayGiao>=start && c.ngayGiao<=end);
    const done = tasks.filter(t=>t.trangThai==='HoanThanh');
    const onTime = done.filter(t=>t.ngayHoanThanh<=t.hanChot).length;
    const late = tasks.filter(t=>t.trangThai==='TreHan').length;
    const avgQ = done.length? Math.round(done.reduce((a,t)=>a+(t.diemChatLuong||0),0)/done.length*10)/10 : 0;
    const monthKey = ui.bcKy==='thang'? ui.bcMonth : currentMonthKey();
    const kpi = kpiScoreForStaff(s.maNV, monthKey);
    return {s, giao:tasks.length, hoanThanh:done.length, treHan:late, dungHan: done.length? Math.round(onTime/done.length*100):0, chatLuong:avgQ, kpi: kpi.score};
  });

  byId('view-root').innerHTML = `
    <div class="view-header">
      <div><h2>Báo cáo công việc</h2><p>${label} · ${rows.length} nhân sự</p></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="bc-export">${icon('download','icon-sm')} Xuất CSV</button>
        <button class="btn btn-primary" id="bc-print">${icon('file','icon-sm')} In báo cáo</button>
      </div>
    </div>
    <div class="toolbar">
      <select class="select-pill" id="bc-ky">
        <option value="tuan" ${ui.bcKy==='tuan'?'selected':''}>Theo tuần</option>
        <option value="thang" ${ui.bcKy==='thang'?'selected':''}>Theo tháng</option>
        <option value="quy" ${ui.bcKy==='quy'?'selected':''}>Theo quý</option>
        <option value="nam" ${ui.bcKy==='nam'?'selected':''}>Theo năm</option>
      </select>
      ${ui.bcKy==='thang'?`<select class="select-pill" id="bc-month">${DB.months.map(m=>`<option value="${m.key}" ${m.key===ui.bcMonth?'selected':''}>${m.label}</option>`).join('')}</select>`:''}
      ${ui.bcKy==='quy'?`<select class="select-pill" id="bc-quarter">${[1,2,3,4].map(q=>`<option value="${q}" ${q===ui.bcQuarter?'selected':''}>Quý ${q}</option>`).join('')}</select>`:''}
      ${(ui.bcKy==='quy'||ui.bcKy==='nam')?`<select class="select-pill" id="bc-year"><option>2026</option><option>2025</option></select>`:''}
      <div class="spacer"></div>
      <span class="muted" style="font-size:12.5px;">Từ ${fmtDateVN(start)} đến ${fmtDateVN(end)}</span>
    </div>
    <div class="card table-wrap" id="bc-table">
      <table>
        <thead><tr><th>Nhân sự</th><th>Vị trí</th><th class="text-right">Việc giao</th><th class="text-right">Hoàn thành</th><th class="text-right">Trễ hạn</th><th class="text-right">Đúng hạn</th><th class="text-right">Chất lượng TB</th><th class="text-right">KPI</th></tr></thead>
        <tbody>${rows.map(r=>`
          <tr>
            <td><div class="cell-name">${avatarHtml(r.s.hoTen,26)}${r.s.hoTen}</div></td>
            <td>${r.s.viTri}</td>
            <td class="text-right tabular">${r.giao}</td>
            <td class="text-right tabular">${r.hoanThanh}</td>
            <td class="text-right tabular" style="${r.treHan?'color:var(--status-critical);font-weight:700;':''}">${r.treHan}</td>
            <td class="text-right">${meterBar(r.dungHan, r.dungHan>=80?'var(--status-good)':r.dungHan>=50?'var(--status-warning)':'var(--status-critical)')}<span class="tabular" style="font-size:11.5px;">${r.dungHan}%</span></td>
            <td class="text-right tabular">${r.chatLuong||'—'}</td>
            <td class="text-right"><span class="chip ${r.kpi>=90?'chip-good':r.kpi>=75?'chip-neutral':'chip-warn'}">${r.kpi??'—'}%</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
      ${!rows.length?`<div class="empty-state">${icon('bars','icon-lg')}<div>Không có dữ liệu trong kỳ này</div></div>`:''}
    </div>
  `;
  byId('bc-ky').addEventListener('change', e=>{ ui.bcKy=e.target.value; renderBaoCao(); });
  const monthSel = byId('bc-month'); if(monthSel) monthSel.addEventListener('change', e=>{ ui.bcMonth=e.target.value; renderBaoCao(); });
  const qSel = byId('bc-quarter'); if(qSel) qSel.addEventListener('change', e=>{ ui.bcQuarter=parseInt(e.target.value); renderBaoCao(); });
  const ySel = byId('bc-year'); if(ySel) ySel.addEventListener('change', e=>{ ui.bcYear=e.target.value; renderBaoCao(); });
  byId('bc-export').addEventListener('click', ()=>exportCSV(rows,label));
  byId('bc-print').addEventListener('click', ()=>window.print());
}
function exportCSV(rows,label){
  const header = ["Nhân sự","Vị trí","Việc giao","Hoàn thành","Trễ hạn","Đúng hạn (%)","Chất lượng TB","KPI (%)"];
  const lines = [header.join(",")].concat(rows.map(r=>[r.s.hoTen,r.s.viTri,r.giao,r.hoanThanh,r.treHan,r.dungHan,r.chatLuong,r.kpi].join(",")));
  const blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `BaoCao_${label.replace(/[^\w]+/g,'_')}.csv`; a.click();
  toast("Đã xuất file CSV");
}

        <h1>TTMKT Hub</h1>
        <p>Hệ thống quản lý Phòng Truyền Thông Marketing — đang chạy ở <b>chế độ demo</b> với dữ liệu mẫu. Chọn một tài khoản để xem giao diện theo đúng phân quyền của vai trò đó.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;max-height:320px;overflow-y:auto;padding:2px;">
          ${DB.nhanSu.map(s=>`
            <button class="btn btn-ghost" style="justify-content:flex-start;padding:8px;border:1px solid var(--border);" data-login="${s.maNV}">
              ${avatarHtml(s.hoTen,30)}
              <span style="overflow:hidden;">
                <div style="font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.hoTen}</div>
                <div style="font-size:11px;color:var(--text-muted);">${ROLE_LABEL[s.vaiTro]} · ${s.viTri}</div>
              </span>
            </button>`).join('')}
        </div>
        <div class="divider">CẤU HÌNH THẬT</div>
        <p style="font-size:12px;">Điền <code>GOOGLE_CLIENT_ID</code> và <code>API_URL</code> trong file để đăng nhập bằng Google thật và nối vào Google Sheets — xem SOP đi kèm.</p>
      </div>`;
    document.querySelectorAll('[data-login]').forEach(b=>b.addEventListener('click', ()=>{
      const s = DB.nhanSu.find(x=>x.maNV===b.getAttribute('data-login'));
      currentUser = {...s};
      bootApp();
    }));
  } else {
    byId('login-screen').innerHTML = `
      <div class="login-card">
        <div class="brand-mark">${icon('target','icon-lg')}</div>
        <h1>TTMKT Hub</h1>
        <p>Đăng nhập bằng tài khoản Google của ${esc(CONFIG.ORG_NAME)} để tiếp tục.</p>
        <div id="gsi-btn-holder"></div>
        <p style="font-size:11.5px;">Hệ thống chỉ cấp quyền cho email có trong danh sách nhân sự.</p>
      </div>`;
    initGoogleSignIn();
  }
}

function initGoogleSignIn(){
  if(typeof google === 'undefined' || !google.accounts){ setTimeout(initGoogleSignIn, 300); return; }
  google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
  google.accounts.id.renderButton(byId('gsi-btn-holder'), {theme:"outline", size:"large", width:280, text:"signin_with"});
}

async function handleCredentialResponse(response){
  try{
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    const res = await realCall("resolveIdentity", {idToken: response.credential});
    currentUser = {...res, idToken: response.credential, email: payload.email, hoTenGoogle: payload.name};
    DB = await realCall("getAll", {});
    bootApp();
  } catch(err){
    toast("Không xác thực được tài khoản: " + err.message);
  }
}

function bootApp(){
  byId('login-screen').style.display = 'none';
  byId('app').style.display = 'flex';
  ui.cvFilterNV='all'; ui.cvFilterThang=null; ui.kpiViTri=null; ui.bcMonth=null; ui.dgThang=null;
  navigate('dashboard');
}

/* ============================= INIT ============================= */
async function initAppShell(){
  if(DEMO_MODE){ DB = buildSampleDB(); }
  renderLoginScreen();
}
document.addEventListener('DOMContentLoaded', initAppShell);


</script>
</body>
</html>
